[workspace]
members = [
    "crates/lance-graph",
    "crates/lance-graph-catalog",
    "crates/lance-graph-benches",
]
# Python package needs to be built by maturin.
exclude = ["crates/lance-graph-python"]
resolver = "2"

# The lance family is pinned exactly (`=1.0.4`): the 1.0.x line has API drift
# (e.g. `DatasetBuilder::from_namespace` went from 3 args in 1.0.1 to 2 in
# 1.0.4). Single source of truth for the verified combination; see README
# "Version constraints".
[workspace.dependencies]
lance = "=1.0.4"
lance-linalg = "=1.0.4"
lance-namespace = "=1.0.4"
