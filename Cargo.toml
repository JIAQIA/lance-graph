[workspace]
members = [
    "crates/lance-graph",
    "crates/lance-graph-catalog",
    "crates/lance-graph-benches",
]
# Python package needs to be built by maturin.
exclude = ["crates/lance-graph-python"]
resolver = "2"

# The lance family is pinned exactly (`=8.0.1`): lance majors are coupled to a
# datafusion major (7/8 => datafusion 53, 9/10 => datafusion 54), and deltalake
# (0.32.4) tops out at datafusion 53 — 8.0.1 is the newest lance line that shares
# one datafusion with the `delta` feature. Single source of truth for the
# verified combination; see README "Version constraints".
[workspace.dependencies]
lance = "=8.0.1"
lance-linalg = "=8.0.1"
lance-namespace = "=8.0.1"
