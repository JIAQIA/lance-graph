[package]
name = "tf-lance-graph"
version = "0.5.5"
edition = "2021"
license = "Apache-2.0"
authors = ["Lance Devs <dev@lancedb.com>"]
repository = "https://github.com/lancedb/lance-graph"
readme = "README.md"
description = "Graph query engine for Lance datasets with Cypher support"
keywords = ["lance", "graph", "cypher", "query", "datafusion"]
categories = ["database", "data-structures", "science"]

[dependencies]
arrow = { version = "58.4", features = ["prettyprint"] }
arrow-array = "58.4"
arrow-schema = "58.4"
async-trait = "0.1"
datafusion = { version = "53.1", default-features = false, features = [
    "nested_expressions",
    "regex_expressions",
    "unicode_expressions",
    "crypto_expressions",
    "encoding_expressions",
    "datetime_expressions",
    "string_expressions",
    "parquet",
] }
datafusion-common = "53.1"
datafusion-expr = "53.1"
datafusion-sql = "53.1"
datafusion-functions-aggregate = "53.1"
futures = "0.3"
tf-lance-graph-catalog = { path = "../lance-graph-catalog", version = "0.5.5" }
lance = { workspace = true }
lance-linalg = { workspace = true }
lance-namespace = { workspace = true }
nom = "7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snafu = "0.8"
deltalake = { version = "0.32.4", features = ["datafusion", "s3", "azure", "gcs"], optional = true }
url = { version = "2", optional = true }

[features]
default = ["unity-catalog", "delta"]
unity-catalog = ["tf-lance-graph-catalog/unity-catalog"]
delta = ["dep:deltalake", "dep:url"]

[dev-dependencies]
futures = "0.3"
lance-arrow = "=8.0.1"
tempfile = "3"
tokio = { version = "1.37", features = ["macros", "rt-multi-thread"] }
