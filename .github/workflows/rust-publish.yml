name: Rust Publish

on:
  release:
    types:
      - released
  pull_request:
    paths:
      - .github/workflows/rust-publish.yml
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run: build & test only, release: build & publish to crates.io"
        required: true
        default: dry_run
        type: choice
        options:
          - dry_run
          - release

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C debuginfo=1"
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"

jobs:
  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # crates.io Trusted Publishing (OIDC): mint a short-lived token instead of
    # relying on a long-lived CARGO_REGISTRY_TOKEN secret.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y protobuf-compiler libssl-dev

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache: false

      - uses: rui314/setup-mold@v1

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'dry_run') }}

      # Publish lance-graph-catalog first: lance-graph's dependency requirement
      # (^0.6.0 after path rewrite) must resolve on the registry before its own
      # publish succeeds. cargo publish waits for index propagation itself.
      - name: Publish tf-lance-graph-catalog
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ "${{ github.event.inputs.mode }}" = "dry_run" ]; then
            EXTRA_ARGS="--dry-run"
          fi
          cargo publish -p tf-lance-graph-catalog --all-features $EXTRA_ARGS

      - name: Publish tf-lance-graph
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ "${{ github.event.inputs.mode }}" = "dry_run" ]; then
            EXTRA_ARGS="--dry-run"
          fi
          cargo publish -p tf-lance-graph --all-features $EXTRA_ARGS
