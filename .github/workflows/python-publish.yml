name: Python Publish

on:
  release:
    types:
      - released
  pull_request:
    paths:
      - .github/workflows/python-publish.yml
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run: build & test only, release: build & publish to PyPI"
        required: true
        default: dry_run
        type: choice
        options:
          - dry_run
          - release

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C debuginfo=1"
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      # Platform contract: every released version must ship all of these
      # artifacts. The publish job enforces the set below (see "Verify
      # artifact set"); if you change this matrix, change that gate in the
      # same commit. A version that ships without linux aarch64 breaks
      # downstream arm64 image builds — never release a partial set.
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            build_sdist: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            build_sdist: false
          - os: macos-14
            target: aarch64-apple-darwin
            build_sdist: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/lance-graph
            crates/lance-graph-catalog
            crates/lance-graph-python

      - name: Install Rust target
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y protobuf-compiler libssl-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install protobuf

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install maturin
        run: |
          pip install maturin

      # Native ubuntu-24.04 / ubuntu-24.04-arm builds tag the wheels
      # manylinux_2_39 (x86_64 / aarch64) — parity with the upstream
      # lance-graph 0.5.4 linux wheel (same tag), which is the version
      # TFRobotServer already runs. For a wider manylinux2014 wheel, build
      # inside ghcr.io/pyo3/maturin (requires ghcr access).
      - name: Build distributions
        working-directory: python
        run: |
          if [ "${{ matrix.build_sdist }}" == "true" ]; then
            maturin build --release --out dist --sdist
          else
            maturin build --release --out dist
          fi

      # Per-arch gate: install the built wheel in a fresh venv and import the
      # package, so a broken wheel never reaches the publish step.
      - name: Smoke test wheel (install + import)
        shell: bash
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install --no-deps python/dist/*.whl
          /tmp/wheel-check/bin/pip install "pyarrow>=14"
          /tmp/wheel-check/bin/python -c "import lance_graph, importlib.metadata as m; print(m.version('tf-lance-graph'))"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist-${{ matrix.target }}
          path: python/dist

  publish:
    if: >
      (github.event_name == 'release' && github.event.action == 'released') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'release')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          pattern: python-dist-*
          path: python/dist
          merge-multiple: true

      # Pre-upload gate. A PyPI release's file set is effectively frozen from
      # the moment it is first fetched: resolvers cache the index page per
      # package with no TTL (poetry in particular), so a wheel uploaded later
      # is silently dropped by any lockfile written before it. That is why
      # backfilling a platform after the fact does not work, and why there is
      # no backfill path in this workflow — a version missing a platform is
      # fixed by cutting a patch release instead (PyPI also rejects new files
      # on releases older than 14 days).
      #
      # This step fails the publish before upload if the built artifact set is
      # incomplete, e.g. a matrix entry was dropped or a wheel's tag changed.
      - name: Verify artifact set
        working-directory: python/dist
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          required=(
            "*-cp39-abi3-manylinux_2_39_x86_64.whl:linux x86_64"
            "*-cp39-abi3-manylinux_2_39_aarch64.whl:linux aarch64"
            "*-cp39-abi3-macosx_11_0_arm64.whl:macOS arm64"
            "*.tar.gz:sdist"
          )

          fail=0
          for entry in "${required[@]}"; do
            pattern="${entry%%:*}"
            label="${entry##*:}"
            matches=( $pattern )
            if [ ${#matches[@]} -eq 0 ]; then
              echo "::error::incomplete artifact set: missing $label ($pattern)"
              fail=1
            else
              printf 'ok  %-14s %s\n' "$label" "${matches[0]}"
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo "::error::refusing to upload an incomplete artifact set; fix the build matrix and cut a patch release — do NOT backfill an already-released version"
            exit 1
          fi

      - name: Publish to PyPI
        working-directory: python
        run: |
          uv publish --trusted-publishing always
