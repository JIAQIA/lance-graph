name: Python Publish

on:
  release:
    types:
      - released
  pull_request:
    paths:
      - .github/workflows/python-publish.yml
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run: build & test only, release: build & publish to PyPI"
        required: true
        default: dry_run
        type: choice
        options:
          - dry_run
          - release
      backfill_ref:
        description: "Backfill: git ref (tag or commit SHA) of an already-released version to build; when set, builds & publishes only the Linux aarch64 wheel for that ref"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C debuginfo=1"
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: Build ${{ matrix.target }}
    env:
      # Backfill mode: build a previously-released version, e.g. to add a
      # wheel for a platform that was missing at release time. Only the
      # Linux aarch64 wheel is built; set `mode` to `release` to publish it.
      BACKFILL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.backfill_ref != '' && github.event.inputs.backfill_ref || '' }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            build_sdist: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            build_sdist: false
          - os: macos-14
            target: aarch64-apple-darwin
            build_sdist: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Backfill mode: build the released version's exact tree.
          ref: ${{ env.BACKFILL != '' && env.BACKFILL || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/lance-graph
            crates/lance-graph-catalog
            crates/lance-graph-python

      - name: Install Rust target
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y protobuf-compiler libssl-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install protobuf

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install maturin
        run: |
          pip install maturin

      # Native ubuntu-24.04 / ubuntu-24.04-arm builds tag the wheels
      # manylinux_2_39 (x86_64 / aarch64) — parity with the upstream
      # lance-graph 0.5.4 linux wheel (same tag), which is the version
      # TFRobotServer already runs. For a wider manylinux2014 wheel, build
      # inside ghcr.io/pyo3/maturin (requires ghcr access).
      - name: Build distributions
        # Backfill mode only builds the Linux aarch64 wheel.
        if: ${{ env.BACKFILL == '' || matrix.os == 'ubuntu-24.04-arm' }}
        working-directory: python
        run: |
          if [ "${{ matrix.build_sdist }}" == "true" ]; then
            maturin build --release --out dist --sdist
          else
            maturin build --release --out dist
          fi

      # Per-arch gate: install the built wheel in a fresh venv and import the
      # package, so a broken wheel never reaches the publish step.
      - name: Smoke test wheel (install + import)
        if: ${{ env.BACKFILL == '' || matrix.os == 'ubuntu-24.04-arm' }}
        shell: bash
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install --no-deps python/dist/*.whl
          /tmp/wheel-check/bin/pip install "pyarrow>=14"
          /tmp/wheel-check/bin/python -c "import lance_graph, importlib.metadata as m; print(m.version('tf-lance-graph'))"

      - name: Upload distributions
        if: ${{ env.BACKFILL == '' || matrix.os == 'ubuntu-24.04-arm' }}
        uses: actions/upload-artifact@v4
        with:
          name: python-dist-${{ matrix.target }}
          path: python/dist

  publish:
    if: >
      (github.event_name == 'release' && github.event.action == 'released') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'release')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          pattern: python-dist-*
          path: python/dist
          merge-multiple: true

      - name: Publish to PyPI
        working-directory: python
        run: |
          uv publish --trusted-publishing always
