name: Python Tests
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - python/**
      - crates/lance-graph/**
      - crates/lance-graph-catalog/**
      - crates/lance-graph-python/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/python-test.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C debuginfo=1"
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "lance-graph-deps"
          workspaces: |
            crates/lance-graph
            crates/lance-graph-catalog
            crates/lance-graph-benches
            crates/lance-graph-python
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y protobuf-compiler
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Create virtual environment and install dependencies
        working-directory: python
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install maturin[patchelf]
          # Test dependencies + the project's runtime deps (knowledge_graph
          # imports yaml/fastapi/uvicorn/fsspec/openai/gcsfs at collection
          # time). Skip editable install to avoid double-building Rust.
          uv pip install pytest pyarrow pandas ruff pylance==10.0.0 \
            fastapi uvicorn pydantic pyyaml fsspec gcsfs openai
      - name: Build Python extension
        working-directory: python
        run: |
          source .venv/bin/activate
          maturin develop
      - name: Start MinIO (storage_options integration test)
        run: |
          docker run -d --name minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          ok=0
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then docker logs minio; exit 1; fi
          docker run --rm --network host --entrypoint /bin/sh minio/mc -c \
            "mc alias set local http://127.0.0.1:9000 minioadmin minioadmin >/dev/null && mc mb local/lance-storage-options-test"
      - name: Run tests
        working-directory: python
        env:
          LANCE_STORAGE_ENDPOINT: http://127.0.0.1:9000
          LANCE_STORAGE_ACCESS_KEY: minioadmin
          LANCE_STORAGE_SECRET_KEY: minioadmin
        run: |
          source .venv/bin/activate
          pytest python/tests/ -v
      - name: Run doctests
        working-directory: python
        run: |
          source .venv/bin/activate
          if [ -f python/lance_graph/__init__.py ]; then
            python -m doctest python/lance_graph/__init__.py || echo "No doctests found"
          fi

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install linting tools
        working-directory: python
        run: |
          uv venv
          source .venv/bin/activate
          # Install only linting tools without building the Rust extension
          uv pip install ruff pyright
      - name: Run ruff format check
        working-directory: python
        run: |
          source .venv/bin/activate
          ruff format --check python/
      - name: Run ruff lint
        working-directory: python
        run: |
          source .venv/bin/activate
          ruff check python/
      - name: Run pyright type check
        working-directory: python
        run: |
          source .venv/bin/activate
          pyright
